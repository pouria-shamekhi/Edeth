<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edeth - Multimedia Editor</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="img/logo.png" alt="Edeth Logo" class="sidebar-logo-img">
        </div>
        <div class="brand-text">
          <h1>Edeth</h1>
          <span class="version">v2.0 PRO</span>
        </div>
      </div>
      <ul class="nav-links">
        <li class="nav-category">WORKSPACE</li>
        <li><a href="#home" class="nav-link active" data-page="home">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Dashboard</span>
        </a></li>

        <li class="nav-category">DSP AUDIO SUITE</li>
        <li><a href="#watermark" class="nav-link" data-page="watermark">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 4V2"/>
            <path d="M15 16v-2"/>
            <path d="M8 9h2"/>
            <path d="M20 9h2"/>
            <path d="M17.8 11.8L19 13"/>
            <path d="M15 9h0"/>
            <path d="M17.8 6.2L19 5"/>
            <path d="M3 21l9-9"/>
            <path d="M12.2 6.2L11 5"/>
          </svg>
          <span>Watermark Remover</span>
          <span class="nav-badge">AI / FFT</span>
        </a></li>

        <li class="nav-category">MEDIA PIPELINE</li>
        <li><a href="#compress" class="nav-link" data-page="compress">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14h6m-6 0l3-3m-3 3l3 3"/>
            <path d="M20 10h-6m6 0l-3-3m3 3l-3 3"/>
            <rect x="2" y="3" width="20" height="18" rx="2"/>
          </svg>
          <span>Compress Video</span>
        </a></li>
        <li><a href="#trim" class="nav-link" data-page="trim">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"/>
            <circle cx="6" cy="18" r="3"/>
            <line x1="20" y1="4" x2="8.12" y2="15.88"/>
            <line x1="14.47" y1="14.48" x2="20" y2="20"/>
            <line x1="8.12" y1="8.12" x2="12" y2="12"/>
          </svg>
          <span>Trim Media</span>
        </a></li>
        <li><a href="#extract" class="nav-link" data-page="extract">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <span>Extract Audio</span>
        </a></li>
        <li><a href="#merge" class="nav-link" data-page="merge">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6L21 6"/>
            <path d="M8 12L21 12"/>
            <path d="M8 18L21 18"/>
            <path d="M3 6L3 18"/>
            <path d="M3 6L8 12"/>
            <path d="M3 18L8 12"/>
          </svg>
          <span>Merge Audio</span>
        </a></li>
        <li><a href="#subtitle" class="nav-link" data-page="subtitle">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="14" x2="23" y2="14"/>
            <line x1="5" y1="18" x2="12" y2="18"/>
            <line x1="15" y1="18" x2="19" y2="18"/>
          </svg>
          <span>Add Subtitles</span>
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="engine-status">
          <span class="status-indicator-dot"></span>
          <span>FFmpeg Core Ready</span>
        </div>
      </div>
    </nav>
    <main id="content">
      <!-- Pages render here -->
    </main>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="js/components.js?v=3.0"></script>
  <script src="js/filebrowser.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
</body>
</html>
